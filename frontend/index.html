<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer></script>
  <style>
    .site-logo {
      height: 28px;
      width: auto;
    }

    header .nav {
      --bs-nav-link-color: #2e7d32;
      --bs-nav-link-hover-color: #173b1b;
    }

    header .nav-link:focus-visible {
      box-shadow: 0 0 0 0.25rem rgba(46, 125, 50, 0.25);
    }

    .hero {
      position: relative;
      aspect-ratio: 1959 / 803;
      overflow: hidden;
      background: #f5f1e9;
    }

    .hero-img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero-content {
      position: absolute;
      top: 50%;
      left: 0;
      width: 49%;
      padding-inline: clamp(0.25rem, 1vw, 1rem);
      transform: translateY(-50%);
      color: #123d1b;
      text-align: center;
    }

    .hero-title {
      margin: 0 0 0.5rem;
      font-size: clamp(1.45rem, 5.5vw, 5rem);
      font-weight: 800;
      line-height: 0.98;
      letter-spacing: -0.05em;
    }

    .hero-title span {
      color: #388c20;
    }

    .hero-subtitle {
      margin: 0 0 1.25rem;
      font-size: clamp(0.85rem, 1.55vw, 1.25rem);
    }

    .hero-price {
      display: inline-block;
      padding: 0.3em 0.75em;
      border-radius: 999px;
      background: #246b24;
      color: #fff;
      font-size: clamp(1rem, 2.2vw, 1.75rem);
      font-weight: 700;
      line-height: 1.2;
    }

    @media (max-width: 575px) {
      .hero-title {
        margin-bottom: 0.55rem;
      }

      .hero-subtitle {
        display: none;
      }
    }

    .catalog-section {
      scroll-margin-top: 1.5rem;
    }

    .product-placeholder {
      aspect-ratio: 1 / 1;
      background-color: #f4f7f1;
      border: 1px solid #b5c8ae;
      color: #47633f;
    }

    /* Misma altura con o sin precio de oferta, para que los botones queden alineados */
    .precio-bloque {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 2.4rem;
    }

    .product-image {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      background-color: #f4f7f1;
    }
  </style>
  <title>FitExpress | Comida rápida saludable</title>
</head>

<body>
  <div class="container">
    <header
      class="d-flex flex-wrap align-items-center justify-content-center justify-content-md-between py-3 mb-4 border-bottom">
      <div class="col-auto mb-2 mb-md-0">
        <a href="/" class="d-inline-flex link-body-emphasis text-decoration-none">
          <img class="site-logo" src="https://pub-1a2cdad7d229486fb35e3638126722d1.r2.dev/logo-trim.webp" alt="FitExpress" width="189" height="28" />
        </a>
      </div>

      <ul class="nav col-12 col-md-auto mb-2 justify-content-center mb-md-0">
        <li><a href="#combos" class="nav-link px-2">Combos</a></li>
        <li><a href="#bowls" class="nav-link px-2">Bowls</a></li>
        <li><a href="#bebestibles" class="nav-link px-2">Bebestibles</a></li>
        <li><a href="#snacks" class="nav-link px-2">Snacks</a></li>
        <li>
          <a href="carrito.html" class="nav-link px-2">
            Carrito <span id="carrito-badge" class="badge rounded-pill text-bg-success"></span>
          </a>
        </li>
        <li><a href="acceso.html" class="nav-link px-2">Acceso</a></li>
      </ul>

    </header>

    <section class="hero rounded-3 mb-4" aria-labelledby="hero-title">
      <img id="hero-image" class="hero-img" alt="Bowl, batido y barra del Combo Power" width="1959" height="803" fetchpriority="high" />
      <div class="hero-content">
        <h1 id="hero-title" class="hero-title">Combo<br><span>Power</span></h1>
        <p class="hero-subtitle">Bowl + batido + barra</p>
        <span class="hero-price">$9.990</span>
      </div>
    </section>

    <main class="pt-3 pb-4" aria-label="Catálogo de productos">
      <section id="combos" class="catalog-section mb-5" aria-labelledby="combos-title">
        <div class="d-flex align-items-center justify-content-between mb-3">
          <h2 id="combos-title" class="h3 mb-0 text-success">Combos</h2>
          <div class="d-flex gap-2">
            <button class="btn btn-outline-success" type="button" data-bs-target="#carousel-combos" data-bs-slide="prev"
              aria-label="Ver combos anteriores" aria-controls="carousel-combos">
              <span aria-hidden="true">&larr;</span>
            </button>
            <button class="btn btn-outline-success" type="button" data-bs-target="#carousel-combos" data-bs-slide="next"
              aria-label="Ver siguientes combos" aria-controls="carousel-combos">
              <span aria-hidden="true">&rarr;</span>
            </button>
          </div>
        </div>
        <div id="carousel-combos" class="carousel slide" role="region" aria-roledescription="carrusel"
          aria-labelledby="combos-title" tabindex="0">
          <div class="carousel-inner" aria-live="polite"></div>
        </div>
      </section>

      <section id="bowls" class="catalog-section mb-5" aria-labelledby="bowls-title">
        <div class="d-flex align-items-center justify-content-between mb-3">
          <h2 id="bowls-title" class="h3 mb-0 text-success">Bowls</h2>
          <div class="d-flex gap-2">
            <button class="btn btn-outline-success" type="button" data-bs-target="#carousel-bowls" data-bs-slide="prev"
              aria-label="Ver bowls anteriores" aria-controls="carousel-bowls">
              <span aria-hidden="true">&larr;</span>
            </button>
            <button class="btn btn-outline-success" type="button" data-bs-target="#carousel-bowls" data-bs-slide="next"
              aria-label="Ver siguientes bowls" aria-controls="carousel-bowls">
              <span aria-hidden="true">&rarr;</span>
            </button>
          </div>
        </div>
        <div id="carousel-bowls" class="carousel slide" role="region" aria-roledescription="carrusel"
          aria-labelledby="bowls-title" tabindex="0">
          <div class="carousel-inner" aria-live="polite"></div>
        </div>
      </section>

      <section id="bebestibles" class="catalog-section mb-5" aria-labelledby="bebestibles-title">
        <div class="d-flex align-items-center justify-content-between mb-3">
          <h2 id="bebestibles-title" class="h3 mb-0 text-success">Bebestibles</h2>
          <div class="d-flex gap-2">
            <button class="btn btn-outline-success" type="button" data-bs-target="#carousel-bebestibles"
              data-bs-slide="prev" aria-label="Ver bebestibles anteriores" aria-controls="carousel-bebestibles">
              <span aria-hidden="true">&larr;</span>
            </button>
            <button class="btn btn-outline-success" type="button" data-bs-target="#carousel-bebestibles"
              data-bs-slide="next" aria-label="Ver siguientes bebestibles" aria-controls="carousel-bebestibles">
              <span aria-hidden="true">&rarr;</span>
            </button>
          </div>
        </div>
        <div id="carousel-bebestibles" class="carousel slide" role="region" aria-roledescription="carrusel"
          aria-labelledby="bebestibles-title" tabindex="0">
          <div class="carousel-inner" aria-live="polite"></div>
        </div>
      </section>

      <section id="snacks" class="catalog-section mb-5" aria-labelledby="snacks-title">
        <div class="d-flex align-items-center justify-content-between mb-3">
          <h2 id="snacks-title" class="h3 mb-0 text-success">Snacks</h2>
          <div class="d-flex gap-2">
            <button class="btn btn-outline-success" type="button" data-bs-target="#carousel-snacks" data-bs-slide="prev"
              aria-label="Ver snacks anteriores" aria-controls="carousel-snacks">
              <span aria-hidden="true">&larr;</span>
            </button>
            <button class="btn btn-outline-success" type="button" data-bs-target="#carousel-snacks" data-bs-slide="next"
              aria-label="Ver siguientes snacks" aria-controls="carousel-snacks">
              <span aria-hidden="true">&rarr;</span>
            </button>
          </div>
        </div>
        <div id="carousel-snacks" class="carousel slide" role="region" aria-roledescription="carrusel"
          aria-labelledby="snacks-title" tabindex="0">
          <div class="carousel-inner" aria-live="polite"></div>
        </div>
      </section>
    </main>
  </div>
  <script type="module" src="/src/catalogo.js"></script>
</body>

</html>
