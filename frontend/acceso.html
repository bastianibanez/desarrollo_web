<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer></script>
  <title>Acceso | FitExpress</title>
  <style>
    .site-logo {
      height: 28px;
      width: auto;
    }

    header .nav {
      --bs-nav-link-color: #2e7d32;
      --bs-nav-link-hover-color: #173b1b;
    }

    header .nav-link:focus-visible {
      box-shadow: 0 0 0 0.25rem rgba(46, 125, 50, 0.25);
    }

    .nav-tabs {
      --bs-nav-link-color: #2e7d32;
      --bs-nav-link-hover-color: #173b1b;
    }
  </style>
</head>

<body>
  <div class="container">
    <header
      class="d-flex flex-wrap align-items-center justify-content-center justify-content-md-between py-3 mb-4 border-bottom">
      <div class="col-auto mb-2 mb-md-0">
        <a href="/" class="d-inline-flex link-body-emphasis text-decoration-none">
          <img class="site-logo" src="https://pub-1a2cdad7d229486fb35e3638126722d1.r2.dev/logo-trim.webp" alt="FitExpress" width="189" height="28" />
        </a>
      </div>

      <ul class="nav col-12 col-md-auto mb-2 justify-content-center mb-md-0">
        <li><a href="index.html#combos" class="nav-link px-2">Combos</a></li>
        <li><a href="index.html#bowls" class="nav-link px-2">Bowls</a></li>
        <li><a href="index.html#bebestibles" class="nav-link px-2">Bebestibles</a></li>
        <li><a href="index.html#snacks" class="nav-link px-2">Snacks</a></li>
        <li>
          <a href="carrito.html" class="nav-link px-2">
            Carrito <span id="carrito-badge" class="badge rounded-pill text-bg-success"></span>
          </a>
        </li>
        <li><a href="acceso.html" class="nav-link px-2" aria-current="page">Acceso</a></li>
      </ul>
    </header>

    <main class="pb-5">
      <a href="index.html" class="link-success d-inline-block mb-4">&larr; Volver al menú</a>

      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="border rounded-3 p-3 p-md-5">
            <h1 class="h2 text-center text-success mb-4">Acceso a FitExpress</h1>
            <div id="acceso-alert"></div>

            <ul class="nav nav-tabs mb-4" id="acceso-tabs" role="tablist">
              <li class="nav-item" role="presentation">
                <button class="nav-link active" id="tab-ingresar" type="button" role="tab"
                  data-bs-toggle="tab" data-bs-target="#panel-ingresar" aria-controls="panel-ingresar"
                  aria-selected="true">Ingresar</button>
              </li>
              <li class="nav-item" role="presentation">
                <button class="nav-link" id="tab-registro" type="button" role="tab"
                  data-bs-toggle="tab" data-bs-target="#panel-registro" aria-controls="panel-registro"
                  aria-selected="false">Registrarme</button>
              </li>
            </ul>

            <div class="tab-content">

              <!-- Login -->
              <section class="tab-pane fade show active" id="panel-ingresar" role="tabpanel"
                aria-labelledby="tab-ingresar" tabindex="0">
                <form id="login-form">
                  <div class="row justify-content-center">
                    <div class="col-md-8">
                      <h2 class="h4 mb-3">Ingresa a tu cuenta</h2>
                      <div class="mb-3">
                        <label for="login-identificador" class="form-label">Correo o usuario</label>
                        <input type="text" class="form-control" id="login-identificador" name="identificador"
                          autocomplete="username" maxlength="150" required />
                      </div>
                      <div class="mb-4">
                        <label for="login-password" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="login-password" name="password"
                          autocomplete="current-password" required />
                      </div>
                      <button type="submit" class="btn btn-success btn-lg w-100">Ingresar</button>
                    </div>
                  </div>
                </form>
              </section>

              <!-- Registro de cliente -->
              <section class="tab-pane fade" id="panel-registro" role="tabpanel"
                aria-labelledby="tab-registro" tabindex="0">
                <form id="registro-form">
                  <h2 class="h4 mb-1">Crea tu cuenta</h2>
                  <p class="text-body-secondary mb-3">
                    Te enviaremos un código al correo para confirmar tu cuenta.
                  </p>

                  <div class="border rounded-3 p-3 p-md-4 mb-4">
                    <h3 class="h6 text-body-secondary mb-3">Datos personales</h3>
                    <div class="row g-3">
                      <div class="col-sm-6">
                        <label for="reg-nombres" class="form-label">Nombres</label>
                        <input type="text" class="form-control" id="reg-nombres" name="nombres"
                          autocomplete="given-name" placeholder="Ana María" maxlength="100" pattern=".*\S.*" required />
                      </div>
                      <div class="col-sm-6">
                        <label for="reg-apellidos" class="form-label">Apellidos</label>
                        <input type="text" class="form-control" id="reg-apellidos" name="apellidos"
                          autocomplete="family-name" placeholder="Soto Pérez" maxlength="100" pattern=".*\S.*" required />
                      </div>
                      <div class="col-sm-6">
                        <label for="reg-rut" class="form-label">RUT</label>
                        <input type="text" class="form-control" id="reg-rut" name="rut"
                          placeholder="12.345.678-5" maxlength="13" pattern=".*\S.*" required />
                      </div>
                      <div class="col-sm-6">
                        <label for="reg-fecha-nacimiento" class="form-label">Fecha de nacimiento</label>
                        <input type="date" class="form-control" id="reg-fecha-nacimiento" name="fecha_nacimiento"
                          autocomplete="bday" required />
                      </div>
                      <div class="col-sm-6">
                        <label for="reg-sexo" class="form-label">Sexo</label>
                        <select class="form-select" id="reg-sexo" name="sexo" required>
                          <option value="" selected disabled>Elige una opción</option>
                          <option value="femenino">Femenino</option>
                          <option value="masculino">Masculino</option>
                          <option value="otro">Otro</option>
                        </select>
                      </div>
                      <div class="col-sm-6">
                        <label for="reg-telefono" class="form-label">Teléfono</label>
                        <input type="tel" class="form-control" id="reg-telefono" name="telefono"
                          autocomplete="tel" placeholder="+56 9 1234 5678" maxlength="20" required />
                      </div>
                      <div class="col-12">
                        <label for="reg-email" class="form-label">Correo electrónico</label>
                        <input type="email" class="form-control" id="reg-email" name="email"
                          autocomplete="email" placeholder="ana@correo.cl" maxlength="150" required />
                      </div>
                    </div>
                  </div>

                  <div class="border rounded-3 p-3 p-md-4 mb-4">
                    <h3 class="h6 text-body-secondary mb-3">Domicilio</h3>
                    <div class="row g-3">
                      <div class="col-12">
                        <label for="reg-direccion" class="form-label">Dirección</label>
                        <input type="text" class="form-control" id="reg-direccion" name="direccion"
                          autocomplete="street-address" placeholder="Av. Providencia 1234, depto. 402"
                          maxlength="200" pattern=".*\S.*" required />
                      </div>
                      <div class="col-12">
                        <label for="reg-comuna" class="form-label">Comuna</label>
                        <select class="form-select" id="reg-comuna" name="comuna_id" required>
                          <option value="" selected disabled>Elige una comuna</option>
                          <option value="1">Providencia</option>
                          <option value="2">Las Condes</option>
                          <option value="3">Ñuñoa</option>
                        </select>
                      </div>
                      <div class="col-sm-6">
                        <label for="reg-provincia" class="form-label">Provincia</label>
                        <input type="text" class="form-control" id="reg-provincia" name="provincia"
                          placeholder="Santiago" maxlength="100" pattern=".*\S.*" required />
                      </div>
                      <div class="col-sm-6">
                        <label for="reg-region" class="form-label">Región</label>
                        <input type="text" class="form-control" id="reg-region" name="region"
                          placeholder="Metropolitana" maxlength="100" pattern=".*\S.*" required />
                      </div>
                    </div>
                  </div>

                  <button type="submit" class="btn btn-success btn-lg w-100">Registrarme</button>
                </form>
              </section>

            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</body>

</html>
