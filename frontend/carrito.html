<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>Finalizar compra | FitExpress</title>
  <style>
    .site-logo {
      height: 28px;
      width: auto;
    }

    header .nav {
      --bs-nav-link-color: #2e7d32;
      --bs-nav-link-hover-color: #173b1b;
    }

    header .nav-link:focus-visible {
      box-shadow: 0 0 0 0.25rem rgba(46, 125, 50, 0.25);
    }

    .product-placeholder {
      width: 88px;
      aspect-ratio: 1 / 1;
      flex-shrink: 0;
      background-color: #f4f7f1;
      border: 1px solid #b5c8ae;
      color: #47633f;
    }
  </style>
</head>

<body>
  <div class="container">
    <header
      class="d-flex flex-wrap align-items-center justify-content-center justify-content-md-between py-3 mb-4 border-bottom">
      <div class="col-auto mb-2 mb-md-0">
        <a href="/" class="d-inline-flex link-body-emphasis text-decoration-none">
          <img class="site-logo" src="assets/img/logo-trim.png" alt="FitExpress" width="189" height="28" />
        </a>
      </div>

      <ul class="nav col-12 col-md-auto mb-2 justify-content-center mb-md-0">
        <li><a href="index.html#combos" class="nav-link px-2">Combos</a></li>
        <li><a href="index.html#bowls" class="nav-link px-2">Bowls</a></li>
        <li><a href="index.html#bebestibles" class="nav-link px-2">Bebestibles</a></li>
        <li><a href="index.html#snacks" class="nav-link px-2">Snacks</a></li>
        <li>
          <a href="carrito.html" class="nav-link px-2">
            Carrito <span id="carrito-badge" class="badge rounded-pill text-bg-success"></span>
          </a>
        </li>
      </ul>

    </header>
    <main class="pb-5">
      <a href="index.html" class="link-success d-inline-block mb-4">&larr; Seguir comprando</a>
      <div class="border rounded-3 p-3 p-md-5">
        <h1 class="h2 text-center text-success mb-5">Finalizar compra</h1>
        <div id="checkout-alert"></div>
        <form id="checkout-form">
          <div class="row g-4 g-lg-5">
            <section class="col-lg-6" aria-labelledby="delivery-title">
              <h2 id="delivery-title" class="h4 mb-3">Completa tus datos</h2>

              <div class="border rounded-3 p-3 p-md-4 mb-4">
                <h3 class="h6 text-body-secondary mb-3">Datos del comprador</h3>
                <div class="row g-3">
                  <div class="col-sm-6">
                    <label for="nombres" class="form-label">Nombres</label>
                    <input type="text" class="form-control" id="nombres" name="nombres" autocomplete="given-name"
                      placeholder="Ana María" maxlength="100" pattern=".*\S.*" required />
                  </div>
                  <div class="col-sm-6">
                    <label for="apellidos" class="form-label">Apellidos</label>
                    <input type="text" class="form-control" id="apellidos" name="apellidos" autocomplete="family-name"
                      placeholder="Soto Pérez" maxlength="100" pattern=".*\S.*" required />
                  </div>
                  <div class="col-sm-6">
                    <label for="rut" class="form-label">RUT</label>
                    <input type="text" class="form-control" id="rut" name="rut" placeholder="12.345.678-5"
                      maxlength="13" pattern=".*\S.*" required />
                  </div>
                  <div class="col-sm-6">
                    <label for="telefono" class="form-label">Teléfono <span
                        class="text-body-secondary">(opcional)</span></label>
                    <input type="tel" class="form-control" id="telefono" name="telefono" autocomplete="tel"
                      placeholder="+56 9 1234 5678" maxlength="20" />
                  </div>
                  <div class="col-12">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" autocomplete="email"
                      placeholder="ana@correo.cl" maxlength="150" required />
                  </div>
                </div>
              </div>

              <div class="border rounded-3 p-3 p-md-4">
                <h3 class="h6 text-body-secondary mb-3">Dirección de despacho</h3>
                <div class="row g-3">
                  <div class="col-sm-8">
                    <label for="calle" class="form-label">Calle</label>
                    <input type="text" class="form-control" id="calle" name="calle" autocomplete="address-line1"
                      placeholder="Av. Providencia" maxlength="150" pattern=".*\S.*" required />
                  </div>
                  <div class="col-sm-4">
                    <label for="numero" class="form-label">Número</label>
                    <input type="text" class="form-control" id="numero" name="numero" placeholder="1234" maxlength="20"
                      pattern=".*\S.*" required />
                  </div>
                  <div class="col-sm-6">
                    <label for="departamento" class="form-label">Departamento <span
                        class="text-body-secondary">(opcional)</span></label>
                    <input type="text" class="form-control" id="departamento" name="departamento"
                      autocomplete="address-line2" placeholder="Depto. 402" maxlength="100" />
                  </div>
                  <div class="col-sm-6">
                    <label for="comuna" class="form-label">Comuna</label>
                    <select class="form-select" id="comuna" name="comuna" required>
                      <option value="" selected disabled>Elige una comuna</option>
                    </select>
                    <div class="form-text">El costo de despacho depende de la comuna.</div>
                  </div>
                </div>
              </div>
            </section>
            <section class="col-lg-6" aria-labelledby="order-title">
              <h2 id="order-title" class="h4 mb-3">Resumen del pedido</h2>
              <div class="border rounded-3 p-3 p-md-4">
                <ul id="carrito-lista" class="list-group list-group-flush"></ul>
                <dl class="mb-0 border-top pt-3">
                  <div class="d-flex justify-content-between gap-3 mb-2">
                    <dt class="fw-normal">Subtotal</dt>
                    <dd id="subtotal" class="mb-0"></dd>
                  </div>
                  <div class="d-flex justify-content-between gap-3 mb-3">
                    <dt class="fw-normal">Despacho de ejemplo</dt>
                    <dd id="despacho" class="mb-0"></dd>
                  </div>
                  <div class="d-flex justify-content-between gap-3 border-top pt-3 fs-5 fw-semibold">
                    <dt>Total</dt>
                    <dd id="total" class="mb-0"></dd>
                  </div>
                </dl>
              </div>
              <button id="btn-pagar" type="submit" class="btn btn-success btn-lg w-100 mt-4">Pagar</button>
            </section>
          </div>
        </form>
      </div>
    </main>
  </div>
  <script type="module" src="/src/checkout.js"></script>
</body>

</html>
